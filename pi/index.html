<h1>pi</h1>
<p>乱数により円周率を求める、最も単純なMonte Carlo計算です。</p>
<ol>
<li>正方形と、内接する四分円を描きます。</li>
<li>正方形の中に、砂を撒きます。</li>
<li>円の中に入った砂の量は、正方形内に撒いた砂の約$\pi/4$になります。</li>
</ol>
