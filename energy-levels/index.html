<h1>Energy levels</h1>
<p>6つの分子が、それぞれいろんな状態をとる場合に、各状態を選ぶ確率がボルツマン分布になることを演示します。</p>
<p>エネルギー準位は等間隔で、全エネルギーはエネルギー準位8段分です。</p>
<p>すべてのとりうる配置のなかで、エネルギーが8になるものだけを数えあげ、各準位が選ばれる確率分布を表示します。</p>
